server:
  port: 8001

spring:
  profiles:
    active: uat
  autoconfigure:
    exclude: org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  application:
    name: sql-script-generate

migration:
  logging:
    directory: ${MIGRATION_LOG_DIR:logs}
  input:
    directory: ${MIGRATION_INPUT_DIR:csv-files}
    users-file: ${MIGRATION_USERS_FILE:users.csv}
    beneficiaries-file: ${MIGRATION_BENEFICIARIES_FILE:beneficiaries.csv}
    templates-file: ${MIGRATION_TEMPLATES_FILE:templates.csv}
  output:
    directory: ${MIGRATION_OUTPUT_DIR:migration-output}
  database:
    schema: ${MIGRATION_DB_SCHEMA:public}
    pending-user-table: ${MIGRATION_PENDING_USER_TABLE:pending_user}
    pending-user-sequence: ${MIGRATION_PENDING_USER_SEQUENCE:pending_user_id_seq}
    auto-create-pending-user-sequence: ${MIGRATION_AUTO_CREATE_PENDING_USER_SEQUENCE:true}
    auto-create-migration-unique-indexes: ${MIGRATION_AUTO_CREATE_UNIQUE_INDEXES:true}

logging:
  config: classpath:logback-spring.xml
  level:
    com.example.sql_script_generate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{migrationRequestId:-system}] %logger{36} - %msg%n"
